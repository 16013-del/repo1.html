<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171713" />
    <title>Firaasah | Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="brand-panel" aria-label="Firaasah clothing">
        <a class="brand-lockup" href="#" aria-label="Firaasah home">
          <svg class="brand-logo" viewBox="0 0 56 56" role="img" aria-label="Firaasah monogram logo">
            <path d="M28 7v5m0 0c0-3-2-5-5-5-2 0-4 2-4 4 0 2 2 4 4 4h10c2 0 4 2 4 4 0 1-1 3-3 4L9 39c-2 1-3 3-3 5 0 3 2 5 5 5h34c3 0 5-2 5-5 0-2-1-4-3-5L22 25" />
            <path d="M15 43h26" />
          </svg>
          <span>FIRAASAH</span>
        </a>

        <div class="brand-copy">
          <p class="collection-label"><span></span> Modern wardrobe, considered</p>
          <h1>Clothing with<br />a point of view.</h1>
          <p class="brand-description">Thoughtful essentials. Refined details. Made for the way you move.</p>
        </div>

        <p class="brand-footer">FIRAASAH <span>—</span> EST. IN GOOD TASTE</p>
      </section>

      <section class="form-panel" aria-labelledby="page-title">
        <div class="login-card">
          <div class="mobile-brand" aria-hidden="true">
            <svg viewBox="0 0 56 56">
              <path d="M28 7v5m0 0c0-3-2-5-5-5-2 0-4 2-4 4 0 2 2 4 4 4h10c2 0 4 2 4 4 0 1-1 3-3 4L9 39c-2 1-3 3-3 5 0 3 2 5 5 5h34c3 0 5-2 5-5 0-2-1-4-3-5L22 25" />
              <path d="M15 43h26" />
            </svg>
            <span>FIRAASAH</span>
          </div>
          <p class="eyebrow">Your wardrobe awaits</p>
          <h2 id="page-title">Welcome back</h2>
          <p class="intro">Sign in to your Firaasah account.</p>

          <form id="loginForm" novalidate>
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Enter your username"
              autocomplete="username"
              required
            />

            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />

            <p id="loginMessage" class="message" role="status" aria-live="polite"></p>
            <button type="submit">Sign in <span aria-hidden="true">→</span></button>
          </form>
        </div>
        <p class="form-footer">FIRAASAH <span>•</span> DRESS WITH INTENTION</p>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
